name: Build and Publish Docker Images

on:
  push:
    branches: [ main ]
    paths:
      - 'docker/**'
      - 'Dockerfile'
      - 'requirements.txt'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Sandbox
        id: meta-sandbox
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/sandbox

      - name: Build and push Sandbox Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.sandbox
          push: true
          tags: ${{ steps.meta-sandbox.outputs.tags }}
          labels: ${{ steps.meta-sandbox.outputs.labels }}

      - name: Extract metadata for Scout
        id: meta-scout
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/scout

      - name: Build and push Scout Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.scout
          push: true
          tags: ${{ steps.meta-scout.outputs.tags }}
          labels: ${{ steps.meta-scout.outputs.labels }}
